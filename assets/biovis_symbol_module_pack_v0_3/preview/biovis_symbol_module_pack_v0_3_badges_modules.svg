<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1700" viewBox="0 0 1600 1700">
<rect width="1600" height="1700" fill="#F7F4EC"/>
<text x="54" y="58" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#17212B" letter-spacing="0">Biological symbol module pack v0.3: badges and modules</text>
<text x="54" y="94" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5D6978" letter-spacing="0">Reusable components for consulting-grade methods, scope, and evidence-status communication.</text>
<text x="54" y="150" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#17212B" letter-spacing="0">Status badges</text>
<image href="../badges/png/generated_context.png" x="54" y="174" width="300" height="105" preserveAspectRatio="xMidYMid meet"/>
<image href="../badges/png/source_proof.png" x="428" y="174" width="300" height="105" preserveAspectRatio="xMidYMid meet"/>
<image href="../badges/png/processed_result.png" x="802" y="174" width="300" height="105" preserveAspectRatio="xMidYMid meet"/>
<image href="../badges/png/validated_result.png" x="1176" y="174" width="300" height="105" preserveAspectRatio="xMidYMid meet"/>
<image href="../badges/png/preliminary.png" x="54" y="314" width="300" height="105" preserveAspectRatio="xMidYMid meet"/>
<image href="../badges/png/caveat.png" x="428" y="314" width="300" height="105" preserveAspectRatio="xMidYMid meet"/>
<image href="../badges/png/train_only.png" x="802" y="314" width="300" height="105" preserveAspectRatio="xMidYMid meet"/>
<image href="../badges/png/held_out.png" x="1176" y="314" width="300" height="105" preserveAspectRatio="xMidYMid meet"/>
