<rect x="54" y="522" width="1492" height="142" rx="18" fill="#FBFAF7" stroke="#AEB8C5" stroke-width="1" opacity="0.72"/>
<image href="../modules/png/biological_scale_ladder.png" x="80" y="536" width="720" height="114" preserveAspectRatio="xMinYMid meet"/>
<text x="838" y="570" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#17212B" letter-spacing="0">Biological scale ladder</text>
<text x="838" y="598" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5D6978" letter-spacing="0">molecule-cell-tissue-organ-organism hierarchy</text>
<text x="838" y="625" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5D6978" letter-spacing="0">type: scale</text>
<rect x="54" y="680" width="1492" height="142" rx="18" fill="#FBFAF7" stroke="#AEB8C5" stroke-width="1" opacity="0.72"/>
<image href="../modules/png/sample_to_feature_stack.png" x="80" y="694" width="720" height="114" preserveAspectRatio="xMinYMid meet"/>
<text x="838" y="728" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#17212B" letter-spacing="0">Sample to feature stack</text>
<text x="838" y="756" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5D6978" letter-spacing="0">sample to assay to matrix to program to model</text>
<text x="838" y="783" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5D6978" letter-spacing="0">type: workflow</text>
<rect x="54" y="838" width="1492" height="142" rx="18" fill="#FBFAF7" stroke="#AEB8C5" stroke-width="1" opacity="0.72"/>
<image href="../modules/png/species_coverage_strip.png" x="80" y="852" width="720" height="114" preserveAspectRatio="xMinYMid meet"/>
<text x="838" y="886" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#17212B" letter-spacing="0">Species coverage strip</text>
<text x="838" y="914" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5D6978" letter-spacing="0">multi-species/model-system scope</text>
<text x="838" y="941" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5D6978" letter-spacing="0">type: scope</text>
<rect x="54" y="996" width="1492" height="142" rx="18" fill="#FBFAF7" stroke="#AEB8C5" stroke-width="1" opacity="0.72"/>
<image href="../modules/png/modality_lane_set.png" x="80" y="1010" width="720" height="114" preserveAspectRatio="xMinYMid meet"/>
<text x="838" y="1044" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#17212B" letter-spacing="0">Modality lane set</text>
<text x="838" y="1072" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5D6978" letter-spacing="0">bulk, single-cell, spatial, proteomics, imaging, organoid modalities</text>
<text x="838" y="1099" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5D6978" letter-spacing="0">type: scope</text>
<rect x="54" y="1154" width="1492" height="142" rx="18" fill="#FBFAF7" stroke="#AEB8C5" stroke-width="1" opacity="0.72"/>
<image href="../modules/png/trust_status_ribbon.png" x="80" y="1168" width="720" height="114" preserveAspectRatio="xMinYMid meet"/>
<text x="838" y="1202" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#17212B" letter-spacing="0">Trust status ribbon</text>
<text x="838" y="1230" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5D6978" letter-spacing="0">source, checksum, split guard, processed result, caveat</text>
<text x="838" y="1257" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5D6978" letter-spacing="0">type: trust</text>
<rect x="54" y="1312" width="1492" height="142" rx="18" fill="#FBFAF7" stroke="#AEB8C5" stroke-width="1" opacity="0.72"/>
<image href="../modules/png/claim_boundary_bar.png" x="80" y="1326" width="720" height="114" preserveAspectRatio="xMinYMid meet"/>
<text x="838" y="1360" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#17212B" letter-spacing="0">Claim boundary bar</text>
<text x="838" y="1388" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5D6978" letter-spacing="0">schematic context vs source proof vs processed result vs validated claim</text>
<text x="838" y="1415" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5D6978" letter-spacing="0">type: trust</text>
<rect x="54" y="1470" width="1492" height="142" rx="18" fill="#FBFAF7" stroke="#AEB8C5" stroke-width="1" opacity="0.72"/>
<image href="../modules/png/space_bio_assay_lane.png" x="80" y="1484" width="720" height="114" preserveAspectRatio="xMinYMid meet"/>
<text x="838" y="1518" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#17212B" letter-spacing="0">Space biology assay lane</text>
<text x="838" y="1546" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5D6978" letter-spacing="0">mission/stressor to tissue to assay to feature layer</text>
<text x="838" y="1573" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5D6978" letter-spacing="0">type: workflow</text>
</svg>
